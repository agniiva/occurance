{{ partial "header.html" . }}
<article>
  <header class="introduction">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "writing" }}<p class="article-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ partial "footer.html" . }}
